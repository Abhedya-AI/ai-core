[project]
name = "abhedya-ai-core"
version = "1.0.0"
description = "ABHEDYA — Production-grade AI platform for knowledge graphs, GraphRAG, and multi-agent intelligence."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    # ── Web Framework ─────────────────────────────────────────────────────────
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # ── Config & Validation ───────────────────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",

    # ── Database ──────────────────────────────────────────────────────────────
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "neo4j>=5.19.0",
    "redis>=5.0.4",

    # ── AI / LLM ─────────────────────────────────────────────────────────────
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "google-genai>=0.5.0",
    "groq>=0.9.0",

    # ── Utilities ─────────────────────────────────────────────────────────────
    "httpx>=0.27.0",
    "networkx>=3.3",
    "numpy>=1.26.4",
    "pandas>=2.2.0",
    "orjson>=3.10.0",
    "loguru>=0.7.2",
    "tenacity>=8.3.0",
    "aiofiles>=23.2.1",

    # ── Security ──────────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "isort>=5.13.2",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

# ── Build ─────────────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff (Linter) ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "T20"]
ignore = ["E501", "B008", "A003"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

# ── Black (Formatter) ─────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── isort ─────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
