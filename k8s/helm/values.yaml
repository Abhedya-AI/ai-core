replicaCount: 3
image:
  repository: abhedya-ai-core
  tag: "latest"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api.abhedya.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: abhedya-tls-secret
      hosts:
        - api.abhedya.io
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
postgresql:
  enabled: true
  host: postgres
  port: 5432
  credentials: {}
neo4j:
  enabled: true
  host: neo4j
  port: 7687
  credentials: {}
redis:
  enabled: true
  host: redis
  port: 6379
  credentials: {}
kafka:
  enabled: true
  host: kafka
  port: 9092
  credentials: {}
observability:
  prometheus:
    enabled: true
  grafana:
    enabled: true
  jaeger:
    enabled: true
security:
  allowedOrigins: "*"
  jwtSecret: "secret"
platform:
  maxWorkers: 4
  cacheTTL: 3600
  batchSize: 100
