apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abhedya-ingress
  namespace: abhedya
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  tls:
    - hosts:
        - api.abhedya.io
      secretName: abhedya-tls-secret
  rules:
    - host: api.abhedya.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: abhedya-ai-core
                port:
                  number: 80
