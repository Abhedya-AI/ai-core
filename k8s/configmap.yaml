apiVersion: v1
kind: ConfigMap
metadata:
  name: abhedya-config
  namespace: abhedya
data:
  APP_NAME: "abhedya-platform"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_PREFIX: "/api/v1"
  WORKERS: "4"
  MAX_CONNECTIONS: "200"
  CACHE_TTL: "3600"
  BATCH_SIZE: "100"
  RATE_LIMIT_WINDOW: "60"
